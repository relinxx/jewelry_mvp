<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jewelry Search</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Application header">
        <div>
          <p class="eyebrow">Catalog similarity</p>
          <h1>Jewelry Search</h1>
        </div>
        <div class="status-pill" id="healthStatus">
          <span class="status-dot"></span>
          <span>Checking API</span>
        </div>
      </header>

      <main class="workspace">
        <section class="search-panel" aria-label="Search controls">
          <form id="searchForm" class="search-form">
            <label class="drop-zone" id="dropZone">
              <input id="imageInput" name="image" type="file" accept="image/jpeg,image/png,image/webp" />
              <span class="drop-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M12 3v12m0-12 4 4m-4-4-4 4M5 21h14a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2" />
                </svg>
              </span>
              <span class="drop-title">Drop image or browse</span>
              <span class="drop-meta">JPEG, PNG, WebP up to 8 MB</span>
            </label>

            <div class="preview-frame" id="previewFrame" hidden>
              <img id="previewImage" alt="Uploaded jewelry preview" />
              <button class="icon-button preview-clear" id="clearImage" type="button" title="Clear image" aria-label="Clear image">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </button>
            </div>

            <div class="control-grid">
              <fieldset class="segmented-control">
                <legend>Category</legend>
                <label>
                  <input type="radio" name="category" value="all" checked />
                  <span>All</span>
                </label>
                <label>
                  <input type="radio" name="category" value="rings" />
                  <span>Rings</span>
                </label>
                <label>
                  <input type="radio" name="category" value="bangles" />
                  <span>Bangles</span>
                </label>
              </fieldset>

              <label class="limit-control">
                <span>Results</span>
                <input id="limitInput" type="range" name="limit" min="1" max="20" value="5" />
                <output id="limitOutput">5</output>
              </label>
            </div>

            <button class="search-button" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />
              </svg>
              <span>Find Similar Jewelry</span>
            </button>
          </form>

          <div class="sample-strip" aria-label="Catalog samples">
            <img src="/catalog/rings/KM_409.jpg" alt="Catalog ring KM 409" />
            <img src="/catalog/rings/KM_532.jpg" alt="Catalog ring KM 532" />
            <img src="/catalog/bangles/KM_1012.jpg" alt="Catalog bangle KM 1012" />
          </div>
        </section>

        <section class="results-panel" aria-live="polite" aria-label="Search results">
          <div class="results-header">
            <div>
              <p class="eyebrow">Closest catalog items</p>
              <h2 id="resultsTitle">Ready to search</h2>
            </div>
            <button class="icon-button" id="resetResults" type="button" title="Reset results" aria-label="Reset results">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" />
              </svg>
            </button>
          </div>

          <div class="message-state" id="messageState">
            <span class="message-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 7h16M4 12h16M4 17h10" />
              </svg>
            </span>
            <p>Upload a jewelry image to compare it with the catalog.</p>
          </div>

          <div class="results-grid" id="resultsGrid"></div>
        </section>
      </main>
    </div>

    <template id="resultTemplate">
      <article class="result-card">
        <img class="result-image" alt="" />
        <div class="result-body">
          <div>
            <p class="result-category"></p>
            <h3 class="result-code"></h3>
          </div>
          <div class="score-block">
            <span>Cosine score</span>
            <strong class="result-score"></strong>
          </div>
          <a class="result-download-btn" download title="Download catalog image">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17" />
            </svg>
            <span>Download</span>
          </a>
        </div>
      </article>
    </template>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
